<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Label Comparison</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/static/label.css">
<link rel="stylesheet" href="/static/diff.css">
</head>
<body>
<header>
  <h1>Compare</h1>
  <a id="toLabel" class="navlink" href="/">Labelling</a>
  <select id="setSel" title="Label set"></select>
  <label class="muted">A <select id="aSel" title="Reference (A)"></select></label>
  <label class="muted">vs B <select id="bSel" title="Compared (B)"></select></label>
  <select id="itemSel" title="Attempt"></select>
  <span class="grow"></span>
  <button id="probBtn" title="Problem (p)">Problem</button>
  <button id="cbBtn" title="Codebook (?)">Codebook</button>
</header>

<main id="labelView">
  <section id="doc"></section>
  <aside id="panel">
    <h3>Show</h3>
    <div id="toggles"></div>
    <label class="muted"><input type="checkbox" id="only" checked> highlights only (fold other paragraphs)</label>
    <h3>Disagreements here</h3>
    <div class="muted">Jump: <kbd>n</kbd> next · <kbd>N</kbd> previous (across attempts)</div>
    <div id="disBox"></div>
  </aside>
</main>

<div id="drawer" class="hidden">
  <div class="dHead"><b id="dTitle"></b><button id="dClose">Close (Esc)</button></div>
  <div id="dBody"></div>
</div>
<div id="toast" class="hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
<script src="/static/diff.js"></script>
</body>
</html>
