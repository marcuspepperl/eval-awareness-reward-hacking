<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gold Labelling</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/static/label.css">
</head>
<body>
<header>
  <h1>Labelling</h1>
  <div class="seg" role="tablist">
    <button id="vItems" role="tab">Work items</button>
    <button id="vLabel" role="tab">Label view</button>
  </div>
  <select id="itemSel" title="Rollout"></select>
  <button id="paraBtn" class="tog">¶</button>
  <span class="grow"></span>
  <span id="saved" class="muted"></span>
  <button id="probBtn" title="Problem (p)">Problem</button>
  <button id="cbBtn" title="Codebook (?)">Codebook</button>
</header>

<main id="labelView">
  <section id="doc"></section>
  <aside id="panel">
    <div id="labelBox"></div>
    <h3>Labels by attempt</h3>
    <div id="allBox"></div>
  </aside>
</main>

<main id="itemsView" class="hidden"><section id="items"></section></main>

<div id="drawer" class="hidden">
  <div class="dHead"><b id="dTitle"></b><button id="dClose">Close (Esc)</button></div>
  <div id="dBody"></div>
</div>

<footer id="keys">
  <span class="k"><i class="sw" style="background:var(--c-eval_awareness)"></i><kbd>1</kbd> EA capability</span>
  <span class="k"><i class="sw" style="background:var(--c-eval_awareness)"></i><kbd>2</kbd> EA safety</span>
  <span class="k"><i class="sw" style="background:var(--c-eval_awareness)"></i><kbd>3</kbd> EA generic</span>
  <span class="k"><i class="sw" style="background:var(--c-grader)"></i><kbd>4</kbd> grader</span>
  <span class="k"><i class="sw" style="background:var(--c-bad_test)"></i><kbd>5</kbd> first bad test</span>
  <span class="k"><i class="sw" style="background:var(--c-cheat_considered)"></i><kbd>6</kbd> first cheat considered</span>
  <span class="sep"></span>
  <span><kbd>u</kbd> speculative</span>
  <span><kbd>⌘Z</kbd> undo</span>
  <span><kbd>m</kbd> read-to-here</span>
  <span><kbd>p</kbd> problem</span>
  <span><kbd>?</kbd> codebook</span>
</footer>
<div id="toast" class="hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
<script src="/static/label.js"></script>
</body>
</html>
